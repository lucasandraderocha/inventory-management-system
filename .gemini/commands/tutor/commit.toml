description = "Executa commit atômico com análise técnica e validação do usuário."
prompt = """
1. Analise as alterações em stage: `git diff --staged`.
2. Se não houver alterações, informe ao usuário que o stage está vazio e pergunte se ele deseja que você adicione arquivos específicos.
3. Se houver alterações, chame `ask_user` para:
   - "Qual o objetivo técnico (o 'porquê') destas alterações?"
   - "Deseja classificar como feat, fix, docs, refactor, test ou chore?"
4. Gere uma mensagem de commit curta e clara seguindo Conventional Commits.
5. Mostre a mensagem proposta e peça confirmação.
6. Após confirmação, execute `git commit -m "[mensagem]"`.
7. Sugira a atualização do `docs/user/diary.md`.
"""
